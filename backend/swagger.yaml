openapi: 3.0.0

info:
  title: WhistleDrop API
  description: Anonymous reporting backend API
  version: 1.0.0

servers:
  - url: http://localhost:5000

tags:
  - name: Reports
    description: Public anonymous reporting APIs
  - name: Moderator
    description: Moderator authentication and report management

paths:

  /api/reports:
    post:
      tags:
        - Reports
      summary: Submit an anonymous report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - description
              properties:
                category:
                  type: string
                  enum:
                    - Security
                    - Harassment
                    - Corruption
                    - Technical
                    - Other
                  example: Technical
                description:
                  type: string
                  minLength: 10
                  maxLength: 5000
                  example: Website login is not working correctly.
                evidenceUrl:
                  type: string
                  example: https://example.com/evidence
      responses:
        "201":
          description: Report submitted successfully
        "400":
          description: Invalid report data

  /api/reports/{caseCode}:
    get:
      tags:
        - Reports
      summary: Track a report using case code
      parameters:
        - name: caseCode
          in: path
          required: true
          schema:
            type: string
          example: WD-A1B2C3D4E5F6
      responses:
        "200":
          description: Report details retrieved
        "404":
          description: Report not found

  /api/moderator/login:
    post:
      tags:
        - Moderator
      summary: Moderator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: moderator@whistledrop.local
                password:
                  type: string
                  example: your-password
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials

  /api/moderator/reports:
    get:
      tags:
        - Moderator
      summary: View reports
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - SUBMITTED
              - UNDER_REVIEW
              - RESOLVED
              - DISMISSED
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - Security
              - Harassment
              - Corruption
              - Technical
              - Other
      responses:
        "200":
          description: Reports retrieved successfully
        "401":
          description: Authentication required

  /api/moderator/reports/{caseCode}/status:
    patch:
      tags:
        - Moderator
      summary: Update report status
      security:
        - bearerAuth: []
      parameters:
        - name: caseCode
          in: path
          required: true
          schema:
            type: string
          example: WD-A1B2C3D4E5F6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - UNDER_REVIEW
                    - RESOLVED
                    - DISMISSED
                  example: UNDER_REVIEW
      responses:
        "200":
          description: Status updated successfully
        "400":
          description: Invalid status or transition
        "401":
          description: Authentication required
        "404":
          description: Report not found

  /api/moderator/reports/{caseCode}/update:
    post:
      tags:
        - Moderator
      summary: Add an update to a report
      security:
        - bearerAuth: []
      parameters:
        - name: caseCode
          in: path
          required: true
          schema:
            type: string
          example: WD-A1B2C3D4E5F6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  maxLength: 1000
                  example: The report is currently under review.
      responses:
        "201":
          description: Update added successfully
        "400":
          description: Invalid update message
        "401":
          description: Authentication required
        "404":
          description: Report not found

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT